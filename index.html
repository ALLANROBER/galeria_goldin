<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria_de_Goldin</title>
<link rel="stylesheet" href="css.css">
</head>

<body>

<h1>Galeria de Goldin 💕</h1>

<div class="gallery">

    <div class="photo">
        <img src="img/foto1.png" alt="Foto 1">
        <div class="caption">Hola 💖</div>
    </div>

    <div class="photo">
        <img src="img/foto2.png" alt="Foto 2">
        <div class="caption">Goldin ✨</div>
    </div>

    <div class="photo">
        <img src="img/foto3.png" alt="Foto 3">
        <div class="caption">Esta sería tu galería 🌸</div>
    </div>

    <div class="photo">
        <img src="img/foto4.png" alt="Foto 4">
        <div class="caption">Espero te guste ❤️</div>
    </div>

    <div class="photo">
        <img src="img/foto5.png" alt="Foto 5">
        <div class="caption">xoxoxo ❤️</div>
    </div>

</div>

<div id="lightbox">
    <button id="prev">❮</button>
    <img id="lightbox-img">
    <button id="next">❯</button>
</div>
<div id="hearts-container"></div>
<audio id="music"></audio>
<script src="javascript.js"></script>

</body>
</html>
